evaluation:
  enabled: true
  output_root: evaluation_results
  experiment_group: milestone_05d
  controller_label: mppi
  baseline_label: zero_command
  baseline_result_dir: ""
  configured_duration: 12.0
  auto_finalize_on_shutdown: true
  max_samples_per_topic: 100000
  maximum_reference_alignment_gap: 0.10
  maximum_command_alignment_gap: 2.00
  maximum_solve_alignment_gap: 2.00
  require_command_for_alignment: false
  steady_state_window: 2.0
  steady_state_fraction: 0.20
  tracking_tolerance: 0.001
  transient_stable_cycles: 10
  minimum_valid_sample_count: 20
  maximum_invalid_sample_percentage: 10.0
  maximum_saturation_percentage: 1.0
  maximum_deadline_overrun_percentage: 5.0
  required_minimum_baseline_improvement: 0.0
  duration_compatibility_tolerance: 1.0
  initial_state_compatibility_tolerance: 5.0e-5
  near_zero_baseline_epsilon: 1.0e-12
  plot_generation: true
  report_generation: true
  enable_finalization_profiling: false
  diagnostic_data_collection: false
  physical_validation: false
  hardware_validation: false
  orchestration:
    enabled: true
    startup_timeout: 20.0
    service_timeout: 10.0
    topic_ready_timeout: 10.0
    reference_ready_timeout: 10.0
    finalization_timeout: 20.0
    initial_stability_duration: 0.5
    initial_stability_samples: 10
    initial_q_stability_tolerance: 5.0e-5
    initial_tip_stability_tolerance: 5.0e-5
    baseline_candidate_q_tolerance: 5.0e-5
    baseline_candidate_tip_tolerance: 5.0e-5
    reference_lead_time: 1.0
    command_zero_tolerance: 1.0e-12
    shutdown_sigint_timeout: 8.0
    shutdown_sigterm_timeout: 4.0
    allow_sigkill_cleanup: false
    require_no_baseline_command: true
    require_recording_before_candidate_command: true
