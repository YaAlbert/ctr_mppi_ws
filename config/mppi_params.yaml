    weights: &optimization_base_weights
      tip: 15000.0
      terminal: 15000.0
      control: 0.005
      smoothness: 0.01
    behavior_preserving_optimization_enabled: true
    cost_normalization:
      enabled: true
      reference_scales: &optimization_reference_scales
        tip: 0.00001078549037381875
        terminal: 0.0000009846810831579434
        control: 0.11857924774155915
        smoothness: 0.22958280573589357
      multipliers: &optimization_baseline_multipliers
        tip: 1.0
        terminal: 1.0
        control: 1.0
        smoothness: 1.0
    simulation_default: false
    note: evaluation-only optimized computation path with exact baseline-equivalent normalized weights
  optimization_c01:
    samples: 36
    horizon: 7
    dt: 0.55
    control_period: 0.10
    noise_std: *optimization_noise
    weights: *optimization_base_weights
    behavior_preserving_optimization_enabled: true
