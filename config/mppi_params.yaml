mppi:
  enabled: true
  control_frequency: 20.0
  dt: 0.05

  horizon: 10
  num_samples: 500
  lambda: 0.001
  random_seed: 42

  command_type: joint_velocity
  warm_start: true
  shift_previous_solution: true
  # Evaluation-configurable behavior-preserving fast path. Production and
  # hardware defaults remain on the reference implementation until a
  # separately approved validation promotes it.
  behavior_preserving_optimization_enabled: false
  # Evaluation-only unit normalization. When enabled by an explicit profile,
  # raw_i/scale_i is weighted by base_weight_i*scale_i*multiplier_i. The core
  # algebraically resolves this to base_weight_i*multiplier_i*raw_i.
  cost_normalization:
    enabled: false

  noise_std:
    insertion: [0.0005, 0.0005, 0.0005]
    rotation: [0.02, 0.02, 0.02]

  weights:
    tip: 100.0
    shape: 0.0
    control: 0.5
    smoothness: 1.0
    obstacle: 0.0
    terminal: 100.0
    force: 0.0
    joint_limit: 100000.0
    stability: 0.0

  tactile:
    enabled: false
    max_age_s: 0.10
    force_saturation_n: 10.0
    proximity_margin_m: 0.0020
    no_contact_multiplier: 0.0
    contact_multiplier: 1.0
    warning_multiplier: 2.0
    stop_multiplier: 4.0

  convergence:
    tip_tolerance: 0.002
    shape_tolerance: 0.003
    stable_cycles: 10

mppi_profiles:
  cylinder_fast:
    samples: 36
    horizon: 7
    dt: 0.55
    control_period: 0.10
    noise_std:
      insertion: [0.0030, 0.0030, 0.0030]
      rotation: [0.100, 0.100, 0.100]
    weights:
      tip: 15000.0
      terminal: 15000.0
      control: 0.005
      smoothness: 0.01
    simulation_default: true
    note: provisional bounded software-test profile tuned for functional cylinder navigation, not real-time certification
  reference_quality:
    samples: 500
    horizon: 10
    dt: 0.05
    control_period: 0.05
    simulation_default: true
    note: existing Milestone 5 reference-quality software-test profile
  paper_economy:
    samples: 24
    horizon: 5
    dt: 0.55
    lambda: 0.001
    control_period: 0.10
    noise_std:
      insertion: [0.0030, 0.0030, 0.0030]
