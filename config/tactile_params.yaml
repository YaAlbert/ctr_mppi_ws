tactile:
  enabled: false
  mode: simulated

  sensor:
    input_dimension: 1
    output_dimension: 1
    sample_frequency: 100.0

  calibration:
    method: linear
    zero_offset: 0.0
    scale: 1.0
    bias: 0.0

  filter:
    type: low_pass
    cutoff_frequency: 10.0
    moving_average_window: 5

  thresholds:
    contact: 0.10
    warning: 0.30
    stop: 0.50
    release: 0.08

  simulation:
    contact_stiffness: 100.0
    contact_damping: 1.0
    latency: 0.0
    noise_std: 0.0